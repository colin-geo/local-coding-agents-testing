services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
    environment:
      - LLAMA_ARG_MODEL=/models/${MODEL_FILE}
      - LLAMA_ARG_N_GPU_LAYERS=${N_GPU_LAYERS:--1}
      - LLAMA_ARG_CTX_SIZE=${CTX_SIZE:-8192}
      - LLAMA_ARG_N_PARALLEL=${PARALLEL:-1}
      - LLAMA_ARG_CACHE_TYPE_K=${CACHE_TYPE_K:-f16}
      - LLAMA_ARG_CACHE_TYPE_V=${CACHE_TYPE_V:-f16}
      - LLAMA_ARG_N_NUM_MOE=${N_NUM_MOE:-}
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
      - LLAMA_ARG_ALIAS=${MODEL_ALIAS:-local-model}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 120s

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    depends_on:
      llama-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
